spring:
  application:
    name: ejercicios-practica
  threads:
    virtual:
      enabled: true
  datasource:
    # Le asignamos valores por defecto si la variable de entorno no existe
    url: jdbc:postgresql://localhost:5432/practica-bd
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:mi-clave-super-secreta-de-desarrollo-local}
  expiration: 86400000  # 24hs en milisegundos